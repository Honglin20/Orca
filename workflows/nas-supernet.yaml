name: nas-supernet
description: "NAS supernet 全链流水线（ns_* agent 重构版，纯增量）：张开超网 → 生成训练脚本 → 生成搜索 pipeline + select_architecture.py → 自愈执行训练/搜索 → 确定性选架构（target_latency 下 max-acc，缺则 Pareto knee）→ retrain 选定子网。7 agent 节点 + 2 fail-loud terminate（model_type 不支持 / select 无候选）。区别于 nas-agent-pipeline.yaml：全新 ns_* agent 名 + fidelity-verifier / workflow-verifier / memory-verifier 三层闭环 + 确定性 Bash select + 模块化 auto-run/retrain + self-heal 白名单审计字段（healed_files / fidelity_retriggered）。"

entry: ns_expand_supernet

# ─────────────────────────────────────────────────────────────────────────────
# inputs（plan §12）——三档标签（contract §6）：[ask]=业务决策必填 / [advanced]=罕见
# override 可选 / [default]=工程默认。seed 全 workflow必有（contract §6 Tier A 子类）。
# ─────────────────────────────────────────────────────────────────────────────
inputs:
  user_project_root:
    type: string
    description: "[ask] 用户原始 PyTorch 项目根目录绝对路径。supernet 张开 / 训练 logic porting / fidelity 校验都以此为源项目锚点（agent.md 经 {{ inputs.user_project_root }} 引用）。必须用户给——代码里能 grep 出事实但项目根本身是意图/上下文边界"
    required: true
  model_path:
    type: string
    description: "[ask] 目标模型入口文件路径（相对 user_project_root 或绝对）。supernet 张开的起点——ns_expand_supernet flatten 此文件生成 supernet.py。项目内唯一锚点，必须用户给"
    required: true
  target_latency_ms:
    type: number
    description: "[ask] 选架构时延目标（毫秒）。ns_select 调 select_architecture.py 时下传 --target-latency-ms：latency ≤ target 的 Pareto 前沿候选里选 max-acc。核心业务 KPI——NAS 无目标 = 瞎搜，必须用户给（knee 兜底是 future follow-up，本阶段恒提供）"
    required: true
  latency_script_path:
    type: string
    description: "[advanced] 用户外部时延脚本路径（可选）。提供则 ns_search_pipeline 生成 latency_estimator.py 时包装此脚本（onnx 单文件契约，见 plan §10）；未提供（默认）走 nas-agent 内置 PyTorch measure_module_latency。罕见 override——多数项目用内置 PyTorch latency 即可"
    required: false
    default: ""
  seed:
    type: int
    description: "[default] 复现性种子（默认 0）。全 workflow 必填（contract §6 Tier A）；agent.md 经 {{ inputs.seed }} 下传到训练/搜索脚本 --seed，deterministic 路径全固定此 seed"
    required: false
    default: 0

nodes:
  # ═══════════════════════════════════════════════════════════════════════════
  # Agent 1: ns_expand_supernet（entry）
  #   把用户 PyTorch 模型 flatten + 施 mandatory supernet readiness 规则 + 张开成
  #   supernet.py + 精炼 SearchSpace；不支持模型类型 → output.model_type_supported=false
  #   → 路由 terminate_unsupported（fail loud，不烧后续训练/搜索算力）。
  #   调 supernet-evaluator / workflow-verifier / memory-verifier（read+embed 协议）。
  # ═══════════════════════════════════════════════════════════════════════════
  - name: ns_expand_supernet
    kind: agent
    agent: ns_expand_supernet
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    output_schema:
      type: object
      required: [output_dir, model_type, model_type_supported, supernet_path, prepared_model, fidelity_passed, workflow_verifier_passed, error, generated_artifacts]
      properties:
        output_dir: {type: string, description: "$ORCA_ARTIFACTS_DIR 绝对路径"}
        model_type: {type: string, description: "Step 4 标签（cnn / isotropic_transformer / hierarchical_transformer / ...）或 'No supported match'"}
        model_type_supported: {type: boolean, description: "true=命中 model_type.json 标签；false=不支持 → 路由 terminate_unsupported"}
        supernet_path: {type: string, description: "supernet.py 路径；不支持时为空串"}
        prepared_model: {type: string, description: "<base_name>_flat.py 或 <base_name>_llm-optimized.py"}
        fidelity_passed: {type: boolean, description: "本节点无 fidelity-verifier 调用 → 恒 true（vacuous）"}
        workflow_verifier_passed: {type: boolean, description: "Step 6 workflow-verifier all-pass → true；unsupported stop → false"}
        error: {type: string, description: "fail loud 时根因；成功→空串"}
        generated_artifacts:
          type: array
          items: {type: string}
          description: "相对 output_dir 的产物路径列表（至少 project_manifest.md / supernet_summary.md / <base_name>_flat.py / supernet.py）"
      additionalProperties: false
    routes:
      # model_type_supported=false（Step 4 判不可分类 / supernet 自测不过）→ 短路 terminate_unsupported
      - when: "ns_expand_supernet.output.model_type_supported != false"
        to: ns_train_script
      # catch-all 放最后（contract §3 / validator._check_route_fallback_last）
      - to: terminate_unsupported

  # ═══════════════════════════════════════════════════════════════════════════
  # Agent 2: ns_train_script
  #   读 expand 上游产物 + 用户训练代码 → 决定 supernet 训练 viability（RL/GAN/momentum-
  #   encoder 类不可行→skip）→ porter 移植训练逻辑 → 生成 train_supernet.py + run_train_supernet.sh
  #   → fidelity-verifier + workflow-verifier + memory-verifier 三 loop 闭环。
  #   下游 ns_run_train 以 run_train_supernet.sh 文件存在性为权威 viability gate（I10）。
  # ═══════════════════════════════════════════════════════════════════════════
  - name: ns_train_script
    kind: agent
    agent: ns_train_script
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    output_schema:
      type: object
      required: [output_dir, viable, reason, train_script_path, train_supernet_py_path, evaluation_paradigm, fidelity_passed, workflow_verifier_passed, error, generated_artifacts]
      properties:
        output_dir: {type: string, description: "$ORCA_ARTIFACTS_DIR 绝对路径（与 expand 共享）"}
        viable: {type: boolean, description: "supernet 训练是否可行；false 时下游 ns_run_train 以 run_train_supernet.sh 文件不存在自门控 skip"}
        reason: {type: string, description: "viability 决定的简短项目证据"}
        train_script_path: {type: string, description: "run_train_supernet.sh 路径；viable=false → 空串"}
        train_supernet_py_path: {type: string, description: "train_supernet.py 路径；viable=false → 空串"}
        evaluation_paradigm: {type: string, enum: [validate, finetune, train_from_scratch], description: "评估范式"}
        fidelity_passed: {type: boolean, description: "fidelity audit loop all-pass → true；viable=false（无 audit）→ true（vacuous）"}
        workflow_verifier_passed: {type: boolean, description: "workflow compliance loop all-pass → true；viable=false → true（vacuous）"}
        error: {type: string, description: "fail loud 时根因；成功→空串（viable=false 不算 error，是正常分支）"}
        generated_artifacts:
          type: array
          items: {type: string}
          description: "相对 output_dir 的产物路径列表"
      additionalProperties: false
    routes:
      - to: ns_search_pipeline

  # ═══════════════════════════════════════════════════════════════════════════
  # Agent 3: ns_search_pipeline
  #   读 train 上游产物 + 用户项目 → 生成 latency_estimator.py（默认 nas-agent PyTorch
  #   measure_module_latency，或包装用户 latency_script_path）+ search 脚本（evaluator /
  #   arch_codec / search_config / run_search_supernet.sh）+ select_architecture.py
  #   （schema-aware JSON 契约）+ AGENTS.md scaffold；Non-Searchable Logic + NPU foreach=False。
  # ═══════════════════════════════════════════════════════════════════════════
  - name: ns_search_pipeline
    kind: agent
    agent: ns_search_pipeline
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    output_schema:
      type: object
      required: [output_dir, latency_estimator_path, search_config_path, evaluator_path, run_search_script_path, select_architecture_path, agents_md_path, fidelity_passed, workflow_verifier_passed, error, generated_artifacts]
      properties:
        output_dir: {type: string, description: "$ORCA_ARTIFACTS_DIR 绝对路径（与上游共享）"}
        latency_estimator_path: {type: string, description: "latency_estimator.py 路径"}
        search_config_path: {type: string, description: "search_config.yaml 路径"}
        evaluator_path: {type: string, description: "evaluator.py 路径"}
        run_search_script_path: {type: string, description: "run_search_supernet.sh 路径"}
        select_architecture_path: {type: string, description: "select_architecture.py 路径（确定性选架构，下游 ns_select Bash 调用）"}
        agents_md_path: {type: string, description: "AGENTS.md scaffold 路径（指引下游 ns_retrain）"}
        fidelity_passed: {type: boolean, description: "Step 2 fidelity audit loop all-pass → true"}
        workflow_verifier_passed: {type: boolean, description: "Step 1+2 两个 workflow compliance loop 都 all-pass → true"}
        error: {type: string, description: "fail loud 时根因；成功→空串"}
        generated_artifacts:
          type: array
          items: {type: string}
          description: "相对 output_dir 的产物路径列表"
      additionalProperties: false
    routes:
      - to: ns_run_train

  # ═══════════════════════════════════════════════════════════════════════════
  # Agent 4: ns_run_train（auto-run，self-gate viability）
  #   自门控：run_train_supernet.sh 不存在（I10 文件存在性权威）→ status=skipped，
  #   yaml 不分支（plan §6）；self-heal max_retries=3 绝不带错下传；detach+poll 沿用
  #   nas-train-runner 句式（I12 Git Bash/MSYS 兼容）。触碰训练逻辑 → 重触 fidelity-verifier
  #   （read+embed 协议）。
  #   yaml 不分支——下游 ns_run_search 拿不到 ckpt 自身 fail loud，最终由 ns_select
  #   路由守卫（selected_arch 空）兜底 terminate_select_failed。
  # ═══════════════════════════════════════════════════════════════════════════
  - name: ns_run_train
    kind: agent
    agent: ns_run_train
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    output_schema:
      type: object
      required: [status, artifacts, assessment, max_retries_hit, healed_files, fidelity_retriggered]
      properties:
        status: {type: string, enum: [executed, skipped, failed], description: "executed=RC=0+ckpt 真产出；skipped=run_train_supernet.sh 不存在（viability self-gate）；failed=自愈耗尽 3 次仍失败（绝不带错下传）"}
        artifacts:
          type: array
          items: {type: string}
          description: "成功时 [supernet_ckpt_path]；skipped/failed 时 []"
        assessment: {type: string, description: "软判断（非闸门）：收敛曲线 / acc / divergence 摘要；failed 时含 last_error 日志尾部"}
        max_retries_hit: {type: boolean, description: "true=3 次尝试耗尽仍失败"}
        healed_files:
          type: array
          items: {type: string}
          description: "本次 self-heal edit 过的文件相对路径（审计字段，对照禁碰清单）"
        fidelity_retriggered: {type: boolean, description: "true=本次触碰训练逻辑类目并重触 project-fidelity-verifier"}
      additionalProperties: false
    routes:
      - to: ns_run_search

  # ═══════════════════════════════════════════════════════════════════════════
  # Agent 5: ns_run_search（auto-run）
  #   执行 run_search_supernet.sh；权威产物 = $ORCA_ARTIFACTS_DIR/search_results.jsonl
  #   （行数 ≥1 才算成功，ns_select 下游依赖）。self-heal max_retries=3 绝不带错下传。
  # ═══════════════════════════════════════════════════════════════════════════
  - name: ns_run_search
    kind: agent
    agent: ns_run_search
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    output_schema:
      type: object
      required: [status, artifacts, assessment, max_retries_hit, healed_files, fidelity_retriggered]
      properties:
        status: {type: string, enum: [executed, failed], description: "executed=RC=0+search_results.jsonl≥1 行；failed=自愈耗尽 3 次仍失败 / 脚本不存在（ns_run_search 无 skipped 分支——agent.md Step 3 python 无 skip 路径，脚本缺失即 failed）"}
        artifacts:
          type: array
          items: {type: string}
          description: "成功时 [search_results.jsonl 路径]；failed 时 []"
        assessment: {type: string, description: "软判断：候选数 / Pareto size / best metric / latency 分布；failed 时含 last_error 日志尾部"}
        max_retries_hit: {type: boolean, description: "true=3 次尝试耗尽仍失败"}
        healed_files:
          type: array
          items: {type: string}
          description: "本次 self-heal edit 过的文件相对路径"
        fidelity_retriggered: {type: boolean, description: "true=本次触碰搜索/评估逻辑类目并重触 project-fidelity-verifier"}
      additionalProperties: false
    routes:
      - to: ns_select

  # ═══════════════════════════════════════════════════════════════════════════
  # Agent 6: ns_select（确定性 Bash，零 LLM 判断）
  #   运行 ns_search_pipeline 生成的 select_architecture.py 恰好一次——读 search_results.jsonl
  #   + target_latency_ms，按「target 下 max-acc；缺则 Pareto knee」策略选架构，stdout 单行
  #   JSON 作唯一最终回复。脚本非 0 / selected_arch 空兜底 → terminate_select_failed。
  #   路由守卫：selected_arch 非空 + pareto_size>0 → ns_retrain；catch-all → terminate_select_failed。
  #   （plan §4.1 note：is defined 只测键存在，不测空——必须用真值判定）
  # ═══════════════════════════════════════════════════════════════════════════
  - name: ns_select
    kind: agent
    agent: ns_select
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    output_schema:
      type: object
      required: [selected_arch, selected_acc, selected_latency_ms, pareto_size, select_reason]
      properties:
        selected_arch:
          # 任务 spec：允许 object 或 null（无候选时）。agent.md §7.2 实际产物为空 dict {}；
          # 两者在 when 真值判定下都 falsy → catch-all terminate_select_failed 兜底。
          type: ["object", "null"]
          description: "选定的子网架构描述（layer-wise 配置）；无候选时为 {} 或 null"
        selected_acc: {type: number, description: "选定子网 search 时的 metric（项目 metric 方向由 select_architecture.py 读 manifest 判 higher/lower-better）"}
        selected_latency_ms: {type: number, description: "选定子网实测/估时延（毫秒）"}
        pareto_size: {type: integer, description: "Pareto 前沿大小；无候选时 0", minimum: 0}
        select_reason:
          type: string
          enum: [max-acc-under-target, pareto-knee, none]
          description: "max-acc-under-target=target_latency 下选 max acc；pareto-knee=无 target 走 knee；none=无候选 fail-loud sentinel"
      additionalProperties: false
    routes:
      # 真值判定（plan §4.1 note）：selected_arch 空对象/null 都 falsy + pareto_size>0 双条件。
      # 不用 `is defined`（只测键存在，空 dict/null 都过）。
      - when: "ns_select.output.selected_arch and ns_select.output.pareto_size > 0"
        to: ns_retrain
      # catch-all 放最后：脚本失败 / 无候选 / select_reason='none' 都落此。
      - to: terminate_select_failed

  # ═══════════════════════════════════════════════════════════════════════════
  # Agent 7: ns_retrain（终态，→ $end）
  #   读 ns_select 选定 arch + AGENTS.md scaffold + summary + manifest → 生成 retrain.py /
  #   finetune.py + run_retrain.sh → fidelity-verifier 复查 → self-heal 执行（max_retries=3，
  #   仅改本次生成的脚本；改训练逻辑→重触 fidelity）→ 读 final test metric 写软判断 assessment。
  #   本阶段 yaml 以 ns_retrain→$end 收尾（ns_visualize 是 Task 9，核心逻辑审查后再加）。
  # ═══════════════════════════════════════════════════════════════════════════
  - name: ns_retrain
    kind: agent
    agent: ns_retrain
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    output_schema:
      type: object
      required: [status, artifacts, assessment, max_retries_hit, healed_files, fidelity_retriggered]
      properties:
        status: {type: string, enum: [executed, failed], description: "executed=RC=0+final ckpt 真产出；failed=自愈耗尽 3 次仍失败 / AGENTS.md 缺（ns_retrain 无 skipped 分支——agent.md Step 5 python 无 skip 路径，缺关键上游即 failed）"}
        artifacts:
          type: array
          items: {type: string}
          description: "成功时 [final retrain ckpt 路径]；failed 时 []"
        assessment: {type: string, description: "软判断：final test acc / latency 对比 / supernet gap；failed 时含 last_error 日志尾部"}
        max_retries_hit: {type: boolean, description: "true=3 次尝试耗尽仍失败"}
        healed_files:
          type: array
          items: {type: string}
          description: "本次 self-heal edit 过的文件相对路径（应仅含 retrain.py / finetune.py / run_retrain.sh）"
        fidelity_retriggered: {type: boolean, description: "true=首次生成后或 self-heal 改训练逻辑后跑过 project-fidelity-verifier"}
      additionalProperties: false
    routes:
      # 引擎只对 terminate 节点读 status（orchestrator._finalize_terminated）——AgentNode 的
      # output.status 不被引擎判失败。故 ns_retrain 失败必须显式路由 terminate_retrain_failed，
      # 否则 status=failed 仍 workflow_completed。ns_retrain 无 skipped 分支（agent.md Step 5
      # python 无 skip 路径），故 status 非 executed（=failed）→ catch-all → fail loud。
      - when: "ns_retrain.output.status == 'executed'"
        to: $end
      - to: terminate_retrain_failed

  # ═══════════════════════════════════════════════════════════════════════════
  # Terminate 节点（plan §6）——status: failed；routes 必空；不作 entry / 不进 parallel。
  # ═══════════════════════════════════════════════════════════════════════════
  - name: terminate_unsupported
    kind: terminate
    status: failed
    reason: "ns_expand_supernet 判定用户模型类型不在 supported NAS architecture 标签内（model_type_supported=false）——supernet 张开阶段就拒绝，不进后续训练/搜索。检查 model.py 是否为单族参数化 body（CNN / isotropic / hierarchical Transformer），或换用其它优化路径。"

  - name: terminate_select_failed
    kind: terminate
    status: failed
    reason: "ns_select 未能选出架构（select_architecture.py 失败 / search_results.jsonl 缺或空 / 所有候选都超 target_latency / pareto_size=0）。回看 ns_run_search.output.assessment 与 $ORCA_ARTIFACTS_DIR/runs/search/ 日志定位搜索是否真产出候选。"

  - name: terminate_retrain_failed
    kind: terminate
    status: failed
    reason: "ns_retrain 未能产出 final 子网 ckpt（self-heal 耗尽 3 次仍失败 / AGENTS.md 缺 / supernet ckpt 缺）。回看 ns_retrain.output.assessment（含 last_error 日志尾部）与 $ORCA_ARTIFACTS_DIR/runs/retrain/ 日志定位 retrain 失败根因。"

# ─────────────────────────────────────────────────────────────────────────────
# outputs —— ns_retrain→$end 终态映射关键产物供 orchestrator / 下游消费。
# ─────────────────────────────────────────────────────────────────────────────
outputs:
  result: "{{ ns_retrain.output }}"
  status: "{{ ns_retrain.output.status }}"
  artifacts: "{{ ns_retrain.output.artifacts }}"
  assessment: "{{ ns_retrain.output.assessment }}"
  selected_arch: "{{ ns_select.output.selected_arch }}"
  selected_acc: "{{ ns_select.output.selected_acc }}"
  selected_latency_ms: "{{ ns_select.output.selected_latency_ms }}"
  pareto_size: "{{ ns_select.output.pareto_size }}"
  supernet_path: "{{ ns_expand_supernet.output.supernet_path }}"
  output_dir: "{{ ns_expand_supernet.output.output_dir }}"
