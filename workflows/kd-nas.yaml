name: kd-nas
description: "通过知识蒸馏（KD）串行迭代搜索更优的轻量化模型结构：每轮派生一个 student → KD 蒸馏 → 实测 latency/accuracy → 决策（达标或预算耗尽即终止）。teacher 用用户默认 lr/epochs 训；全程 metrics 推 web。"

entry: flatten

# KB 根目录探测（apply_kb_requirement 解析 → 注入 ORCA_KB_DIR；迭代轮 gen_student 读 KB 技术点）。
requires: [knowledge_base]

inputs:
  # ── inputs 标签约定（description 前缀，供 in-session 编排器/tars skill 读取）──
  #   [ask]      Tier A：业务决策（意图/预算/KPI/硬件/模型入口/业务命令），用户意图未给则启动前集中询问
  #   [advanced] Tier C：工程默认（固化，不问；罕见 override）
  #
  # 铁律：latency_provider 必填无默认（编译期 validator 强制 required⇒无 default），
  # 用户必须给真部署硬件的 latency 脚本——ONNXRT-CPU 测对 NPU 部署是误导。

  baseline_model_path:
    type: string
    description: "[ask] 用户 PyTorch 模型入口文件（任意 .py / yaml / config 入口；flatten agent 会展平成 KD 变体契约 build_model + DUMMY_INPUT + KNOBS，不再要求用户自带契约）"
    required: true
  user_train_script:
    type: string
    description: "[ask] 用户原 train.py 路径（含 compute_loss + build_dataloader），kd-train-script 读、生成 train_pipeline.py 时搬 loss/dataloader/optimizer（自包含拷贝，不 import 用户项目）；同时提取 teacher 默认 lr/epochs 供 train_teacher 用"
    required: true
  target_latency_ms:
    type: string
    description: "[ask] latency 目标阈值(ms)；student latency ≤ 此值（经用户 latency_provider 实测）才算达标"
    required: true
  accuracy_baseline:
    type: string
    description: "[ask] 精度基线（用户提供的绝对值，如 NMSE=0.02 / SNR=20）。student 精度须达此基线（方向由 kind 决定）"
    required: true
  accuracy_baseline_kind:
    type: string
    description: "[ask] 精度方向（用户一开始声明，绝不靠符号 auto 猜——防 dB 反向错误）：nmse/mse/ber/db（越低越好，best=min）| snr/acc（越高越好，best=max）"
    required: true
  latency_provider:
    type: string
    description: "[ask] 用户 latency 测量脚本 `path::func`（真部署硬件 NPU/GPU 实测）。所有 latency 测量必用此脚本——无默认、不可省"
    required: true
  max_rounds:
    type: string
    description: "[ask] 最大迭代轮数（寻优预算）；耗尽即终止走 finalize。默认 10。**注意**：引擎节点访问上限兜底 100；KD 每轮 3 节点（gen_student+distill+decide）+ 前置 6（flatten/setup/gen_teacher/gen_train_script/train_script_verify/train_teacher）+ finalize 1 = max_rounds×3+7，故 max_rounds > 31 时须配合 `--max-iter <max_rounds*3+10>` CLI 覆盖，否则 MaxIterationsError 会在 finalize 前终止"
    required: false
    default: "10"
  metrics_template:
    type: string
    description: "[advanced] 可选 metrics 摘取模板 JSON（SPEC §9 schema：{source_log, metrics:[{name,regex,chart_type,x,y}]}）；空=只推 loss 曲线。train_teacher / distill 末尾的 metrics_tail 读"
    required: false
    default: ""
  device:
    type: string
    description: "[advanced] ONNX 导出 + latency 测量 + 训练设备：auto（默认 cuda→npu→cpu）/ cuda / npu / cpu"
    required: false
    default: "auto"
  full_epochs:
    type: string
    description: "[advanced] 每轮蒸馏 epoch 数（默认 50；非 proxy）"
    required: false
    default: "50"
  seed:
    type: string
    description: "[advanced] 复现种子（默认 0）"
    required: false
    default: "0"

nodes:
  # ═══════════════════════════════════════════════════════════════
  # flatten（入口·LLM + 脚本混合）：把用户任意 PyTorch 模型入口展平成 KD 变体契约 .py
  # （build_model + DUMMY_INPUT + KNOBS）+ __main__ 跑「正确性 + latency」→ 产 baseline_contract_path
  # + baseline_latency_ms（latency_provider 在此阶段就生效）。末尾 viz_kd_stage --stage baseline 推 latency bar。
  # ═══════════════════════════════════════════════════════════════
  - name: flatten
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    agent: model-flatten
    output_schema:
      type: object
      required: [baseline_contract_path, project_root, model_name, flat_artifacts_dir, baseline_latency_ms, viz_status]
      properties:
        baseline_contract_path: {type: string, description: "展平产出的契约 .py 绝对路径（build_model + DUMMY_INPUT + KNOBS；经 validate_contract.py PASS）"}
        project_root: {type: string, description: "从 baseline_model_path 向上推断的 project_root 绝对路径（低置信时带后缀）"}
        model_name: {type: string, description: "推断的 <base_name>"}
        flat_artifacts_dir: {type: string, description: "<output_dir> 绝对路径"}
        baseline_latency_ms: {type: number, description: "flatten __main__ 测出的默认 cfg latency 中位数（latency_provider 真测；setup 透传作 baseline 参考线，不再重测）"}
        viz_status:
          type: object
          required: [env_status, charts]
          additionalProperties: false
          description: "本节点 web 推送状态（dumb copy 自 viz_kd_stage / metrics_tail stdout）。失败值（env_missing/generic 等）合法产出；缺字段=节点 fail（agent 未遵守契约）。viz 为 sidecar：失败值不阻断主流程。"
          properties:
            env_status: {type: string, enum: [ok, env_loaded_from_file, env_missing, import_failed, generic, skipped]}
            charts:
              type: object
              description: "{图名: {pushed: bool, reason: str}}；全 pushed=true 即成功。"
              additionalProperties:
                type: object
                required: [pushed, reason]
                additionalProperties: false
                properties:
                  pushed: {type: boolean}
                  reason: {type: string}
    routes:
      - to: setup

  # ═══════════════════════════════════════════════════════════════
  # setup（一次性·幂等）：探测 shared infra 路径 + seed baseline champion + device 探测。
  # **不含 teacher 训练**（拆到 train_teacher）。所有下游专用路径字段作为顶层 output 一次给齐。
  # ═══════════════════════════════════════════════════════════════
  - name: setup
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    agent: kd-setup
    output_schema:
      type: object
      required: [kd_artifacts_dir, per_run_artifacts_dir, project_root, kd_scripts_dir, struct_scripts_dir, ledger_path, champions_path, ckpts_dir, snapshots_dir, worktree_root, device, concurrency, baseline_latency_ms, baseline_accuracy, viz_status]
      properties:
        kd_artifacts_dir: {type: string, description: "稳定 artifact 根（末尾带 /）。跨 run 持久"}
        per_run_artifacts_dir: {type: string, description: "$ORCA_ARTIFACTS_DIR（per-run；env_anchor 用）"}
        project_root: {type: string}
        kd_scripts_dir: {type: string, description: "_kd_scripts 绝对路径（distill/decide 调脚本用）"}
        struct_scripts_dir: {type: string, description: "_struct_scripts 绝对路径（finalize export_onnx 用）"}
        ledger_path: {type: string, description: "ledger.jsonl 绝对路径（跨 run 真相源）"}
        champions_path: {type: string, description: "champions.jsonl 绝对路径（champion ratchet 轨迹，setup seed baseline）"}
        ckpts_dir: {type: string, description: "<kd_artifacts_dir>ckpts/（末尾带 /）"}
        snapshots_dir: {type: string, description: "<kd_artifacts_dir>snapshots/（末尾带 /）"}
        worktree_root: {type: string, description: "<kd_artifacts_dir>.worktrees/（末尾带 /）"}
        device: {type: string, description: "gpu_probe 解析的 device（cuda/cpu/npu/auto）"}
        concurrency: {type: integer, description: "串行版恒 1（防误用并发蒸馏池，违 SPEC §3.1 串行化）"}
        baseline_latency_ms: {type: number, description: "flatten.output.baseline_latency_ms 透传"}
        baseline_accuracy: {type: number, description: "inputs.accuracy_baseline 透传"}
        viz_status:
          type: object
          required: [env_status, charts]
          additionalProperties: false
          description: "本节点 web 推送状态（dumb copy 自 viz_kd_stage / metrics_tail stdout）。失败值（env_missing/generic 等）合法产出；缺字段=节点 fail（agent 未遵守契约）。viz 为 sidecar：失败值不阻断主流程。"
          properties:
            env_status: {type: string, enum: [ok, env_loaded_from_file, env_missing, import_failed, generic, skipped]}
            charts:
              type: object
              description: "{图名: {pushed: bool, reason: str}}；全 pushed=true 即成功。"
              additionalProperties:
                type: object
                required: [pushed, reason]
                additionalProperties: false
                properties:
                  pushed: {type: boolean}
                  reason: {type: string}
    routes:
      - to: gen_teacher

  # ═══════════════════════════════════════════════════════════════
  # gen_teacher（复用 teacher-gen）：纯调参派生 teacher（深×3/宽×2 wrapper）+ latency 真测 +
  # validate_teacher 双重 PASS。末尾 viz_kd_stage --stage teacher 推 teacher vs baseline bar。
  # ═══════════════════════════════════════════════════════════════
  - name: gen_teacher
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    agent: teacher-gen
    output_schema:
      type: object
      required: [teacher_model_path, teacher_latency_ms, project_root, depth_axis, width_axis, viz_status]
      properties:
        teacher_model_path: {type: string, description: "teacher wrapper .py 绝对路径（委托 baseline.build_model；双重硬校验 PASS）"}
        teacher_latency_ms: {type: number, description: "teacher __main__ 实测 latency 中位数（latency_provider 真测；train_teacher 透传进 teacher_cache/meta）"}
        project_root: {type: string, description: "透传 flatten.output.project_root"}
        depth_axis: {type: string, description: "识别的深度轴 knob 名（gen_student 首轮缩层用）"}
        width_axis: {type: string, description: "识别的宽度轴 knob 名"}
        viz_status:
          type: object
          required: [env_status, charts]
          additionalProperties: false
          description: "本节点 web 推送状态（dumb copy 自 viz_kd_stage / metrics_tail stdout）。失败值（env_missing/generic 等）合法产出；缺字段=节点 fail（agent 未遵守契约）。viz 为 sidecar：失败值不阻断主流程。"
          properties:
            env_status: {type: string, enum: [ok, env_loaded_from_file, env_missing, import_failed, generic, skipped]}
            charts:
              type: object
              description: "{图名: {pushed: bool, reason: str}}；全 pushed=true 即成功。"
              additionalProperties:
                type: object
                required: [pushed, reason]
                additionalProperties: false
                properties:
                  pushed: {type: boolean}
                  reason: {type: string}
    routes:
      - to: gen_train_script

  # ═══════════════════════════════════════════════════════════════
  # gen_train_script（复用 kd-train-script + 扩展 teacher 默认 lr/epochs 提取）：
  # 生成 train_pipeline.py（teacher+distill+eval 三 mode）+ 从 user_train_script 提 lr/epochs。
  # ═══════════════════════════════════════════════════════════════
  - name: gen_train_script
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    agent: kd-train-script
    output_schema:
      type: object
      required: [train_pipeline_path, teacher_default_lr, teacher_default_epochs]
      properties:
        train_pipeline_path: {type: string, description: "生成的 train_pipeline.py 绝对路径（三 mode 自包含；py_compile + teacher smoke PASS）"}
        teacher_default_lr: {type: number, description: "从 user_train_script 提取的用户默认 lr（train_teacher 用，非硬编码 1e-3）"}
        teacher_default_epochs: {type: integer, description: "从 user_train_script 提取的用户默认 epochs（train_teacher 用，非硬编码 1）"}
    routes:
      - to: train_script_verify

  # ═══════════════════════════════════════════════════════════════
  # train_script_verify（新写）：校验 train_pipeline.py（mode 函数齐全 + 用户函数搬入 +
  # live push helpers + micro eval 跑一步）。verified=false → fail loud 阻塞（配置错误非业务波动）。
  # ═══════════════════════════════════════════════════════════════
  - name: train_script_verify
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    agent: train-script-verify
    output_schema:
      type: object
      required: [verified, issues]
      properties:
        verified: {type: boolean, description: "true=校验全过；false=issues 非空 fail loud 阻塞（不进 train_teacher）"}
        issues:
          type: array
          description: "校验失败的 issue 列表（空=通过）"
          items: {type: string}
    routes:
      - to: train_teacher

  # ═══════════════════════════════════════════════════════════════
  # train_teacher（独立节点，从 setup 拆出）：跑 train_pipeline.py --mode teacher（用户默认 lr/epochs）+
  # teacher_setup 产 cache + metrics_tail 推 loss。幂等：teacher_cache+meta+ckpt 存在 ∧ sha256 匹配 → 跳。
  # teacher 训练崩 → fail loud（teacher_cache 缺整个循环无意义，SPEC §15 不走 catch）。
  # ═══════════════════════════════════════════════════════════════
  - name: train_teacher
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    agent: train-teacher
    output_schema:
      type: object
      required: [teacher_cache, teacher_meta, teacher_ckpt, teacher_latency_ms, viz_status]
      properties:
        teacher_cache: {type: string, description: "teacher_cache.pt 绝对路径（distill --teacher_cache 用）"}
        teacher_meta: {type: string, description: "teacher_meta.json（含 teacher_model_hash + teacher_ckpt_sha256 + teacher_latency_ms 透传）"}
        teacher_ckpt: {type: string, description: "teacher ckpt（train_pipeline --mode teacher 产出）"}
        teacher_latency_ms: {type: number, description: "gen_teacher.output.teacher_latency_ms 透传（非自测）"}
        viz_status:
          type: object
          required: [env_status, charts]
          additionalProperties: false
          description: "本节点 web 推送状态（dumb copy 自 viz_kd_stage / metrics_tail stdout）。失败值（env_missing/generic 等）合法产出；缺字段=节点 fail（agent 未遵守契约）。viz 为 sidecar：失败值不阻断主流程。"
          properties:
            env_status: {type: string, enum: [ok, env_loaded_from_file, env_missing, import_failed, generic, skipped]}
            charts:
              type: object
              description: "{图名: {pushed: bool, reason: str}}；全 pushed=true 即成功。"
              additionalProperties:
                type: object
                required: [pushed, reason]
                additionalProperties: false
                properties:
                  pushed: {type: boolean}
                  reason: {type: string}
    routes:
      - to: gen_student

  # ═══════════════════════════════════════════════════════════════
  # 一轮（循环体 3 节点）—— 循环回到 gen_student 由 decide 的 route 控制
  # ═══════════════════════════════════════════════════════════════

  # Step 1：gen_student（LLM 整文件改写）：首轮固定规则（缩1层+FFN→pointwise）/ 迭代轮 KB+perf。
  # DUMMY_INPUT 字节级 deterministic 校验 + validate_contract PASS（3 strikes → catch FAIL_build）。
  - name: gen_student
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    agent: gen-student
    output_schema:
      type: object
      required: [student_model_path, round, hypothesis, direction_id, knobs, status, viz_status]
      properties:
        student_model_path: {type: string, description: "snapshots/r<round>_student_model.py 绝对路径"}
        round: {type: integer, description: "本轮轮次（ledger student 行数 + 1）"}
        hypothesis: {type: string, description: "本轮结构假设一句话（首轮固定规则 / 迭代轮 KB+perf 驱动）"}
        direction_id: {type: string, description: "首轮: scale_1_layer | ffn_pointwise；迭代轮: KB direction Dx | off_catalog:fingerprint"}
        knobs: {type: string, description: "student.KNOBS 的 JSON 串（省 distill 重复加载）"}
        status: {type: string, enum: [OK, FAIL_build], description: "OK=validate PASS；FAIL_build=catch 协议（3 strikes 过不了）"}
        fail_reason: {type: string, description: "status=FAIL_build 时填，否则空串"}
        viz_status:
          type: object
          required: [env_status, charts]
          additionalProperties: false
          description: "本节点 web 推送状态（dumb copy 自 viz_kd_stage / metrics_tail stdout）。失败值（env_missing/generic 等）合法产出；缺字段=节点 fail（agent 未遵守契约）。viz 为 sidecar：失败值不阻断主流程。"
          properties:
            env_status: {type: string, enum: [ok, env_loaded_from_file, env_missing, import_failed, generic, skipped]}
            charts:
              type: object
              description: "{图名: {pushed: bool, reason: str}}；全 pushed=true 即成功。"
              additionalProperties:
                type: object
                required: [pushed, reason]
                additionalProperties: false
                properties:
                  pushed: {type: boolean}
                  reason: {type: string}
    routes:
      - to: distill

  # Step 2：distill（新写，单 student KD）：tune_latency → FAIL_latency 跳训练 → distill 训练（--kd_config recipe 必传）→ eval。
  # catch 协议：训练/eval rc≠0 → status=FAIL_train，agent 退 0 → decide 落账 continue。
  - name: distill
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    agent: distill
    output_schema:
      type: object
      required: [round, student_model_path, accepted_cfg, cfg_hash, latency_ms, latency_ms_std, accuracy, met_latency, met_accuracy, ckpt, tune_status, status, viz_status]
      properties:
        round: {type: integer}
        student_model_path: {type: string}
        accepted_cfg: {type: object, description: "tune_latency 产出的 accepted cfg（JSON object；distill build_cfg 来源 + ledger 审计）"}
        cfg_hash: {type: string, description: "accepted_cfg sha256 前 16（ledger 去重 + audit）"}
        latency_ms: {type: number, description: "tune_latency 实测 latency 中位数（FAIL_* 时填 best_effort）"}
        latency_ms_std: {type: number, description: "latency std（重复测量）"}
        accuracy: {type: number, description: "eval 实测 accuracy；FAIL_* 时 -1"}
        accuracy_kind: {type: string, description: "eval STUDENT_ACCURACY_KIND；FAIL_* 时空串"}
        met_latency: {type: boolean, description: "latency ≤ target"}
        met_accuracy: {type: boolean, description: "accuracy 达 baseline（方向按 kind）"}
        ckpt: {type: string, description: "student ckpt 路径；FAIL_* 时空串"}
        tune_status: {type: string, enum: [ACCEPTED, FAIL_latency]}
        status: {type: string, enum: [SUCCESS, FAIL_latency, FAIL_train, FAIL_build], description: "N21 映射：SUCCESS↔ACCEPTED / FAIL_latency↔FAIL_latency / FAIL_train↔ACCEPTED / FAIL_build=gen_student FAIL_build 早退（catch 协议）"}
        fail_reason: {type: string, description: "FAIL_* 时填 rc + stderr 尾 300 字"}
        viz_status:
          type: object
          required: [env_status, charts]
          additionalProperties: false
          description: "本节点 web 推送状态（dumb copy 自 viz_kd_stage / metrics_tail stdout）。失败值（env_missing/generic 等）合法产出；缺字段=节点 fail（agent 未遵守契约）。viz 为 sidecar：失败值不阻断主流程。"
          properties:
            env_status: {type: string, enum: [ok, env_loaded_from_file, env_missing, import_failed, generic, skipped]}
            charts:
              type: object
              description: "{图名: {pushed: bool, reason: str}}；全 pushed=true 即成功。"
              additionalProperties:
                type: object
                required: [pushed, reason]
                additionalProperties: false
                properties:
                  pushed: {type: boolean}
                  reason: {type: string}
    routes:
      - to: decide

  # Step 3：decide（新写，KD 专版 reducer min-latency）：kd_reducer.py append ledger + champion ratchet +
  # continue_loop 决策。失败 student 也落账 continue（除非 max_rounds）。
  - name: decide
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    agent: decide
    output_schema:
      type: object
      required: [round, continue_loop, champion_id, champion_latency_ms, champion_accuracy, viz_status]
      properties:
        round: {type: integer}
        continue_loop: {type: boolean, description: "true=未达标且未耗尽预算 → 继续循环；false=终止走 finalize"}
        champion_id: {type: string, description: "当前全局 champion id（min-latency ratchet + FIFO tiebreak）"}
        champion_latency_ms: {type: number}
        champion_accuracy: {type: number}
        terminate_reason: {type: string, description: "continue_loop=false 时的原因（target_met / max_rounds / 空串）"}
        viz_status:
          type: object
          required: [env_status, charts]
          additionalProperties: false
          description: "本节点 web 推送状态（dumb copy 自 viz_kd_stage / metrics_tail stdout）。失败值（env_missing/generic 等）合法产出；缺字段=节点 fail（agent 未遵守契约）。viz 为 sidecar：失败值不阻断主流程。"
          properties:
            env_status: {type: string, enum: [ok, env_loaded_from_file, env_missing, import_failed, generic, skipped]}
            charts:
              type: object
              description: "{图名: {pushed: bool, reason: str}}；全 pushed=true 即成功。"
              additionalProperties:
                type: object
                required: [pushed, reason]
                additionalProperties: false
                properties:
                  pushed: {type: boolean}
                  reason: {type: string}
    routes:
      # 循环机制：DAG 内 back-route（条件 cycle）。continue_loop=true → 回 gen_student 开下一轮；
      # false → 出循环走 finalize。route 由 router 纯函数求值（确定性控制流，非 LLM 自驱）。
      - when: "decide.output.continue_loop"
        to: gen_student
      - to: finalize

  # ═══════════════════════════════════════════════════════════════
  # finalize（KD 专版 inline prompt）：champion=baseline 兜底（不重蒸馏）+ eval + ONNX + latency
  # + final_report.md + 终态可视化。champion 是真 student 时用 champion ckpt 跑 eval（不重训，N10 省 GPU）。
  # ═══════════════════════════════════════════════════════════════
  - name: finalize
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    tools: [bash, read, write, glob, grep]
    output_schema:
      type: object
      required: [final_model, final_onnx, final_latency_ms, final_accuracy, final_report, viz_status]
      properties:
        final_model: {type: string, description: "champion student_model_path；champion=baseline 时填 baseline_contract_path"}
        final_onnx: {type: string, description: "final.onnx 绝对路径；champion=baseline 时空串（跳过导出）"}
        final_latency_ms: {type: number}
        final_accuracy: {type: number}
        final_report: {type: string, description: "final_report.md 绝对路径"}
        viz_status:
          type: object
          required: [env_status, charts]
          additionalProperties: false
          description: "本节点 web 推送状态（dumb copy 自 viz_kd_stage / metrics_tail stdout）。失败值（env_missing/generic 等）合法产出；缺字段=节点 fail（agent 未遵守契约）。viz 为 sidecar：失败值不阻断主流程。"
          properties:
            env_status: {type: string, enum: [ok, env_loaded_from_file, env_missing, import_failed, generic, skipped]}
            charts:
              type: object
              description: "{图名: {pushed: bool, reason: str}}；全 pushed=true 即成功。"
              additionalProperties:
                type: object
                required: [pushed, reason]
                additionalProperties: false
                properties:
                  pushed: {type: boolean}
                  reason: {type: string}
    prompt: |
      你是 kd-nas 串行版的 **收尾 + 终态可视化**：调 finalize_kd.py（确定性后端）跑 champion eval/ONNX/latency
      + 写 final_report.md（champion=baseline 兜底跳过 student 命令）+ 调 viz_kd_stage 推终态图。

      ## 输入（Jinja 已渲染）
      - champion：`{{ decide.output.champion_id }}` / terminate_reason `{{ decide.output.terminate_reason }}`
      - ledger：`{{ setup.output.ledger_path }}` / champions：`{{ setup.output.champions_path }}`
      - baseline/teacher latency / accuracy / target / kind / latency_provider / device / seed 等
      - kd_scripts_dir：`{{ setup.output.kd_scripts_dir }}`（finalize_kd.py + viz_kd_stage.py 所在）

      ## 执行（fail loud）

      ### Step 1：调 finalize_kd.py（确定性后端：champion 查 / eval / ONNX / latency / final_report.md）

      ```bash
      KD_SCRIPTS_DIR="{{ setup.output.kd_scripts_dir }}"
      FIN_OUT="$(python3 "$KD_SCRIPTS_DIR/finalize_kd.py" \
        --ledger "{{ setup.output.ledger_path }}" \
        --champions "{{ setup.output.champions_path }}" \
        --champion_id "{{ decide.output.champion_id }}" \
        --terminate_reason "{{ decide.output.terminate_reason }}" \
        --baseline_contract_path "{{ flatten.output.baseline_contract_path }}" \
        --train_pipeline_path "{{ gen_train_script.output.train_pipeline_path }}" \
        --baseline_latency_ms "{{ setup.output.baseline_latency_ms }}" \
        --baseline_accuracy "{{ setup.output.baseline_accuracy }}" \
        --teacher_latency_ms "{{ gen_teacher.output.teacher_latency_ms }}" \
        --target_latency_ms "{{ inputs.target_latency_ms }}" \
        --accuracy_baseline "{{ inputs.accuracy_baseline }}" \
        --accuracy_baseline_kind "{{ inputs.accuracy_baseline_kind }}" \
        --kd_artifacts_dir "{{ setup.output.kd_artifacts_dir }}" \
        --struct_scripts_dir "{{ setup.output.struct_scripts_dir }}" \
        --kd_scripts_dir "$KD_SCRIPTS_DIR" \
        --device "{{ setup.output.device }}" --seed "{{ inputs.seed }}" \
        --latency_provider "{{ inputs.latency_provider }}" \
        --project_root "{{ setup.output.project_root }}" \
        --per_run_artifacts_dir "{{ setup.output.per_run_artifacts_dir }}" 2>&1)"
      FIN_RC=$?
      echo "$FIN_OUT"
      if [ $FIN_RC -ne 0 ]; then
        echo "FAIL: finalize_kd.py rc=$FIN_RC（champion eval/ONNX/latency 异常？final_report 写不出？）" >&2
        exit 2
      fi
      CHAMPION_IS_BASELINE="$(echo "$FIN_OUT" | grep '^CHAMPION_IS_BASELINE:' | awk '{print $2}')"
      CHAMP_STUDENT="$(echo "$FIN_OUT" | grep '^CHAMPION_STUDENT:' | cut -d' ' -f2-)"
      FINAL_LATENCY="$(echo "$FIN_OUT" | grep '^FINAL_LATENCY_MS:' | awk '{print $2}')"
      FINAL_ACCURACY="$(echo "$FIN_OUT" | grep '^FINAL_ACCURACY:' | awk '{print $2}')"
      FINAL_ONNX="$(echo "$FIN_OUT" | grep '^FINAL_ONNX:' | cut -d' ' -f2-)"
      FINAL_REPORT="$(echo "$FIN_OUT" | grep '^FINAL_REPORT:' | cut -d' ' -f2-)"
      echo "PARSED step1: CHAMPION_IS_BASELINE=$CHAMPION_IS_BASELINE FINAL_LATENCY=$FINAL_LATENCY FINAL_REPORT=$FINAL_REPORT"
      ```

      ### Step 2：viz_kd_stage --stage final（终态对比 bar + champion 汇总表 dumb copy 进 viz_status）

      ```bash
      VIZ_STDOUT=$(python3 "$KD_SCRIPTS_DIR/viz_kd_stage.py" \
        --stage final \
        --champions "{{ setup.output.champions_path }}" \
        --ledger "{{ setup.output.ledger_path }}" \
        --baseline_latency_ms "{{ setup.output.baseline_latency_ms }}" \
        --teacher_latency_ms "{{ gen_teacher.output.teacher_latency_ms }}" \
        --champion_latency_ms "$FINAL_LATENCY" \
        --accuracy_baseline_kind "{{ inputs.accuracy_baseline_kind }}" \
        --env_anchor "{{ setup.output.per_run_artifacts_dir }}" \
        || true)
      VIZ_STATUS=$(python3 -c "
      import json, sys
      o = json.loads(sys.argv[1])
      print(json.dumps({'env_status': o.get('viz_env_status', 'generic'), 'charts': o.get('charts', {})}))
      " "$VIZ_STDOUT")
      echo "VIZ_STATUS_JSON=$VIZ_STATUS"
      ```

      ## 输出（**必须是合法 JSON 对象**，匹配上方 output_schema；非 JSON → fail loud）
      ```json
      {"final_model": "<CHAMP_STUDENT abs>",
       "final_onnx": "<FINAL_ONNX | 空串>",
       "final_latency_ms": <FINAL_LATENCY float>,
       "final_accuracy": <FINAL_ACCURACY float>,
       "final_report": "<FINAL_REPORT abs>",
       "viz_status": <VIZ_STATUS_JSON 对象>}
      ```
    routes:
      - to: $end

outputs:
  result: "{{ finalize.output }}"
  champion: "{{ decide.output.champion_id }}"
  final_latency_ms: "{{ finalize.output.final_latency_ms }}"
  final_accuracy: "{{ finalize.output.final_accuracy }}"
  final_report: "{{ finalize.output.final_report }}"
  final_onnx: "{{ finalize.output.final_onnx }}"
  kd_artifacts_dir: "{{ setup.output.kd_artifacts_dir }}"
  ledger_path: "{{ setup.output.ledger_path }}"
  terminate_reason: "{{ decide.output.terminate_reason }}"
  rounds_explored: "{{ decide.output.round }}"
  baseline_latency_ms: "{{ setup.output.baseline_latency_ms }}"
  teacher_latency_ms: "{{ gen_teacher.output.teacher_latency_ms }}"
