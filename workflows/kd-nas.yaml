name: kd-nas
description: "KD-NAS 蒸馏 sweep（重构版）：receiver KB 的 model8 .py 变体 → 确定性遍历。setup 测 baseline 时延 + 幂等训 teacher(10层 t1/t2 交替，KD 软标签源) + 适配 train_kd；selector 取下一未蒸馏变体 + 最小缩量 latency 调参；distill 完整蒸馏训练（非 proxy，每-epoch render_chart 实时图）+ 测精度对比用户绝对基线；recorder 记账 + 推图。跨 run 复用（稳定 kd_artifacts_dir + 哈希校验 + ledger-driven 跳过）。无 finalize / 无 proxy_mse / 无 search。精度基线 + latency_provider(用户真硬件脚本) 均用户必填。契约见 workflows/agents/_kd_scripts/CONTRACTS.md。"

entry: setup

# KB 根目录探测（apply_kb_requirement 解析 → 注入 ORCA_KB_DIR，pick_variant glob families/receiver/*.py）。
requires: [knowledge_base]

inputs:
  # ── inputs 标签约定（description 前缀，供 in-session 编排器/tars skill 读取）──
  #   [ask]      Tier A：业务决策（意图/预算/KPI/硬件/模型入口/业务命令），用户意图未给则启动前集中询问
  #   [advanced] Tier C：工程默认（固化，不问；罕见 override）
  #
  # 铁律（spec-review BLK-3/10）：latency_provider 必填无默认（编译期 validator 强制 required⇒无default），
  # 用户必须给真部署硬件的 latency 脚本——ONNXRT-CPU 测对 NPU 部署是误导。

  teacher_train_command:
    type: string
    description: "[ask] teacher 从头训练命令（10 层 model8，无 KD），原样 shell 执行（绝不改训练函数/loss）。teacher 只作 KD 软标签源"
    required: true
  test_command:
    type: string
    description: "[ask] eval/测试命令（测 student 精度，原样执行）。脚本须读 STUDENT_CKPT 加载本轮 ckpt，产出含可解析精度（NMSE/MSE/BER/SNR/accuracy）"
    required: true
  target_latency_ms:
    type: string
    description: "[ask] latency 目标阈值(ms)；student latency ≤ 此值（经用户 latency_provider 实测）才算达标"
    required: true
  accuracy_baseline:
    type: string
    description: "[ask] 精度基线（用户提供的绝对值，如 NMSE=0.02 / SNR=20）。student 精度须达此基线（方向由 kind 决定）"
    required: true
  baseline_model_path:
    type: string
    description: "[ask] 原始 baseline 模型文件（4 层，时延参考）。须是契约文件（暴露 build_model + DUMMY_INPUT），setup 测其 latency 作参考线"
    required: true
  latency_provider:
    type: string
    description: "[ask] 用户 latency 测量脚本 `path::func`（真部署硬件 NPU/GPU 实测）。所有 latency 测量必用此脚本——无默认、不可省（BLK-3/10）"
    required: true
  device:
    type: string
    description: "[advanced] ONNX 导出 + latency 测量设备：auto（默认 cuda→npu→cpu）/ cuda / npu / cpu"
    required: false
    default: "auto"
  seed:
    type: string
    description: "[advanced] 复现种子（默认 0）。权重 init / dummy / tune 全固定此 seed（HI-2）"
    required: false
    default: "0"
  kd_artifacts_dir:
    type: string
    description: "[advanced] 跨 run 稳定 artifact 根（teacher_cache/ledger/ckpts/...）。空→默认 <repo>/kd-nas-artifacts/（U-1）"
    required: false
    default: ""
  accuracy_baseline_kind:
    type: string
    description: "[advanced] 锁精度方向 + 校验：nmse/mse/ber(越低越好) | snr/acc(越高越好)。空→自动检测+WARN（U-2/SR3）"
    required: false
    default: ""
  full_epochs:
    type: string
    description: "[advanced] 每变体完整蒸馏训练 epoch 数（默认 50；非 proxy）"
    required: false
    default: "50"
  latency_tune_budget:
    type: string
    description: "[advanced] latency 调参最大 cfg 测量数（硬 cap，默认 40）；= tune_latency --max_measurements"
    required: false
    default: "40"
  kd_force_rerun:
    type: string
    description: "[advanced] 忽略 ledger 全量重扫变体（U-5：仅 variants；teacher/baseline 各自哈希正交）。true/false"
    required: false
    default: "false"

nodes:
  # ═══════════════════════════════════════════════════════════════
  # setup（一次性·幂等）：测 baseline 时延 + 校验/训 teacher + 适配 train_kd + 预检变体。
  # 跨 run 复用：teacher_cache 存在 ∧ teacher_model_hash 匹配 ∧ teacher_ckpt_sha256 匹配 → 跳过 teacher 训练。
  # ═══════════════════════════════════════════════════════════════
  - name: setup
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    agent: kd-setup
    output_schema:
      type: object
      required: [kd_artifacts_dir, per_run_artifacts_dir, project_root, teacher_model_path, teacher_cache, teacher_meta, teacher_ckpt, ledger_path, ckpts_dir, baseline_latency_ms, kd_scripts_dir]
      properties:
        kd_artifacts_dir: {type: string, description: "稳定 artifact 根绝对路径（末尾带 /）。跨 run 持久"}
        per_run_artifacts_dir: {type: string, description: "$ORCA_ARTIFACTS_DIR（per-run，orca_env.sh 祖先；train_kd env_anchor / viz env_anchor 用）"}
        project_root: {type: string}
        teacher_model_path: {type: string, description: "repo 内 teacher_model.py 绝对路径（10 层 t1/t2）"}
        teacher_cache: {type: string, description: "teacher_cache.pt 绝对路径"}
        teacher_meta: {type: string, description: "teacher_meta.json 绝对路径（含 teacher_model_hash/teacher_ckpt_sha256）"}
        teacher_ckpt: {type: string}
        ledger_path: {type: string, description: "ledger.jsonl 绝对路径（跨 run 真相源）"}
        ckpts_dir: {type: string, description: "<kd_artifacts_dir>ckpts/ 绝对路径（末尾带 /）"}
        baseline_latency_ms: {type: number, description: "原始 baseline(4层) 实测 latency 中位数（参考线）"}
        kd_scripts_dir: {type: string, description: "_kd_scripts 绝对路径"}
        user_train_import: {type: string, description: "用户 train 模块 dotted-path（BLK-7 持久化；空则 distill 走哨兵）"}
        user_loss_fn: {type: string, description: "用户 loss callable 名（BLK-7）"}
        variants_count: {type: integer, description: "KB receiver 变体数（BLK-14 预检 ≥1）"}
    routes:
      - to: selector

  # ═══════════════════════════════════════════════════════════════
  # selector（gatekeeper）：pick_variant 取下一未蒸馏变体（无→all_done→$end）→
  # tune_latency 最小缩量找 accepted_cfg（或 FAIL_latency）。
  # ═══════════════════════════════════════════════════════════════
  - name: selector
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    agent: kd-selector
    output_schema:
      type: object
      required: [all_done, tune_status, variant_id]
      properties:
        all_done: {type: boolean, description: "true=无未蒸馏变体，路由 $end（首条 when）"}
        tune_status: {type: string, enum: [ACCEPTED, FAIL_latency], description: "ACCEPTED=latency 达标有 accepted_cfg；FAIL_latency=预算耗尽仍超 target"}
        variant_id: {type: string, description: "变体 id（.py stem）；all_done 时空"}
        variant_path: {type: string}
        variant_sha256: {type: string}
        accepted_cfg: {type: string, description: "JSON 串：tune 接受的 build_cfg（FAIL_latency 时为 best_effort_cfg）"}
        latency_ms_median: {type: number, description: "tune 测得 latency 中位数（HI-13）"}
        latency_ms_std: {type: number}
        build_fn: {type: string}
        dummy_input: {type: string, description: "JSON 串（变体 DUMMY_INPUT）"}
        knobs: {type: string, description: "JSON 串（变体 KNOBS）"}
        measurements: {type: integer}
    routes:
      - when: "selector.output.all_done"
        to: $end
      - to: distill

  # ═══════════════════════════════════════════════════════════════
  # distill：distill_dispatch gate（noop|train）。FAIL_latency→不训练出 FAIL_latency；
  # ACCEPTED→复用 selector latency（HI-1）+ 完整蒸馏训练（实时图）+ measure_student 测精度（绝对基线）。
  # ═══════════════════════════════════════════════════════════════
  - name: distill
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    agent: kd-distill
    output_schema:
      type: object
      required: [variant_id, status, met_latency, met_accuracy]
      properties:
        variant_id: {type: string}
        status: {type: string, enum: [SUCCESS, FAIL_latency, FAIL_accuracy, FAIL_train, FAIL_export], description: "BLK-17：须与 selector.tune_status 一致（recorder 断言）"}
        latency_ms_median: {type: number, description: "复用自 selector（HI-1）；FAIL_export 时 -1"}
        latency_ms_std: {type: number}
        accuracy: {type: number, description: "measure_student 测得；未测时 0.0"}
        accuracy_kind: {type: string}
        met_latency: {type: boolean}
        met_accuracy: {type: boolean, description: "对比用户 accuracy_baseline（方向由 kind）"}
        ckpt: {type: string, description: "蒸馏 ckpt 绝对路径；未训练时空"}
        fail_reason: {type: string}
    routes:
      - to: recorder

  # ═══════════════════════════════════════════════════════════════
  # recorder：断言 tune_status↔distill.status 一致（BLK-17）→ 写 ckpt 验存在 → append ledger → 推图 → 回 selector。
  # ═══════════════════════════════════════════════════════════════
  - name: recorder
    kind: agent
    executor: opencode
    model: "deepseek/deepseek-v4-flash"
    agent: kd-recorder
    output_schema:
      type: object
      required: [recorded, variants_done, variants_total]
      properties:
        recorded: {type: boolean, description: "true=账本已 append（含失败行）"}
        variants_done: {type: integer, description: "已完成变体数（读 ledger）"}
        variants_total: {type: integer}
        coherence_ok: {type: boolean, description: "BLK-17 一致性断言通过"}
    routes:
      - to: selector

outputs:
  result: "{{ setup.output.ledger_path }}"
  ledger_path: "{{ setup.output.ledger_path }}"
  kd_artifacts_dir: "{{ setup.output.kd_artifacts_dir }}"
  baseline_latency_ms: "{{ setup.output.baseline_latency_ms }}"
  # HI-4：不引 recorder.output（终态 transition 是 selector(all_done)→$end，recorder 不在此次跑）。
  # 变体完成数读 ledger.jsonl（稳定真相源），不在 workflow outputs 暴露。
