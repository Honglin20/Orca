[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[lint]
select = [
    "F401", # unused imports — auto-removed by --fix
    "F811", # redefinition of unused name — reported (not auto-fixable, safety net)
    "F821", # undefined name — reported (not auto-fixable, safety net)
    "F822", # undefined name in __all__
    "F823", # local variable referenced before assignment
    "F841", # local variable assigned but never used — auto-removed by --fix
    "I001", # import sorting — auto-fixed by --fix
]
