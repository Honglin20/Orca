[project]
name = "nas-agent"
version = "0.1.0"
description = "A Neural Architecture Search (NAS) toolkit for automated PyTorch supernet design, search, and curation."
authors = [{ name = "zaber" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "einops",
    "ptflops",
    "python-dotenv",
    "omegaconf",
    "torch>=2.6.0",
    "evox>=1.3.0",
    "ruff",
    "onnxscript>=0.7.0",
    "ray",
]

[project.optional-dependencies]
cpu = ["onnxruntime"]
gpu = ["onnxruntime-gpu"]

[project.scripts]
nas-search = "nas_agent.cli.search:main"
nas-select-architecture = "nas_agent.cli.select_architecture:main"

[dependency-groups]
dev = [
    "ipywidgets",
    "jupyterlab",
    "notebook",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

