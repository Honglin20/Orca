# test.yml 鈥斺€?phase 11 P0.1 CI gate锛圫PEC 搂0 / 搂10.1 / 璁″垝 P0.1锛?#
# 姣忔 push / PR 鑷姩璺戝叏閲忓崟娴嬶紙鎺掗櫎 integration锛夛紝缁挎墠鍏佽鍚堝苟銆?# integration 娴嬭瘯闇€鐪?spawn claude + ANTHROPIC_API_KEY锛岀敱 integration.yml
# 缁?PR comment `/integration` 鏄惧紡瑙﹀彂锛屾湰 gate 姘镐笉璺戝畠浠€?#
# 璇﹁ docs/specs/phase-11-cli-enrichment.md 搂10.1銆乨ocs/releases/2026-07-01-phase11-ci.md銆?
name: test

on:
  workflow_dispatch:

# 鍚屼竴鍒嗘敮鏂?push 鍙栨秷鏃?run锛岀渷 CI 棰濆害
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        # 涓嶉攣瀹?uv 鐗堟湰锛氳窡闅忔渶鏂帮紙@v3 action 榛樿鍗?latest锛夛紝鎹?uv 涓嶅繀鏀?workflow
        with:
          version: "latest"

      - name: Sync dependencies
        run: uv sync

      - name: Run tests (exclude integration)
        run: uv run pytest tests/ -m "not integration"
